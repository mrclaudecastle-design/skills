# Settings for teaching Qwen to talk like Mila, on the Mac.
# Keys checked against mlx-lm 0.32.2. Run from this folder:
#   mlx_lm.lora --config lora_config.yaml
#
# Gentle first-run settings for a Mac with limited memory. Each run saves
# into its own adapter folder; change adapter_path for every new run so
# an older run is never overwritten.

model: ../../../../Qwen3-8B-mlx-4bit   # the converted copy, see README step 1
train: true
fine_tune_type: lora
data: data-v3               # folder holding train.jsonl and valid.jsonl (v3: 1,200 varied calls)
seed: 7

num_layers: 8               # how much of the model is taught; raise to 16 if memory allows
batch_size: 1
grad_accumulation_steps: 4
grad_checkpoint: true       # slower, but uses much less memory
iters: 300
learning_rate: 1.0e-5
max_seq_length: 1024
mask_prompt: true           # learn from Mila's replies, not the caller's lines

steps_per_report: 10
steps_per_eval: 100
val_batches: 10
save_every: 100
adapter_path: adapters/run-02

lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0
